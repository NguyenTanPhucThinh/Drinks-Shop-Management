name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  # Có commit mới thì hủy lần chạy cũ của cùng PR/nhánh để tiết kiệm phút Actions
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1. Build, Unit test, Lint
  # ---------------------------------------------------------------
  build:
    name: Build, Unit test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Cài JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Gradle (có cache + kiểm tra gradle-wrapper.jar)
        uses: gradle/actions/setup-gradle@v5
        with:
          # Chỉ main/develop được ghi cache, nhánh feature chỉ đọc
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      - run: chmod +x ./gradlew

      - name: Build debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit test
        run: ./gradlew testDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Upload báo cáo lint/test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. Chạy thử app trên máy ảo: mở app + bấm ngẫu nhiên, bắt crash/ANR
  # ---------------------------------------------------------------
  smoke-test:
    name: Chạy thử app trên máy ảo
    needs: build   # Dùng lại APK của job build, không build lại
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Tải APK từ job build
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk

      - name: Bật KVM (tăng tốc máy ảo)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Đọc package name từ APK
        run: |
          APK=$(ls apk/*.apk | head -n 1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)
          PKG=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          if [ -z "$PKG" ]; then
            echo "::error::Không đọc được package name từ APK."
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "Package: $PKG"

      # Emulator runner chạy 'script' từng dòng riêng lẻ, nên logic nhiều dòng phải để trong file
      - name: Tạo script smoke test
        run: |
          cat > smoke.sh <<'EOF'
          #!/usr/bin/env bash
          FAIL=0
          mkdir -p smoke-results

          adb install -r "$APK" || { echo "::error::Cài APK lên máy ảo thất bại."; exit 1; }
          adb logcat -c

          echo "== Bước 1: Mở app =="
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > /dev/null
          sleep 8
          adb shell screencap -p /sdcard/launch.png && adb pull /sdcard/launch.png smoke-results/launch.png
          if ! adb shell pidof "$PKG" > /dev/null; then
            echo "::error::App bị tắt ngay sau khi mở (crash lúc khởi động). Xem logcat.txt trong artifact smoke-results."
            FAIL=1
          fi

          if [ "$FAIL" = 0 ]; then
            echo "== Bước 2: Bấm ngẫu nhiên 500 thao tác =="
            # -s 42: seed cố định để lặp lại đúng chuỗi thao tác khi debug
            adb shell monkey -p "$PKG" -s 42 --throttle 300 --pct-syskeys 0 -v 500 > smoke-results/monkey.txt 2>&1
            if grep -qE '// CRASH|// NOT RESPONDING|Monkey aborted' smoke-results/monkey.txt; then
              echo "::error::App bị crash hoặc treo (ANR) khi chạy thử. Xem monkey.txt và logcat.txt trong artifact smoke-results."
              FAIL=1
            fi
          fi

          adb logcat -d > smoke-results/logcat.txt
          if grep -A 1 'FATAL EXCEPTION' smoke-results/logcat.txt | grep -q "Process: $PKG"; then
            echo "== Stack trace của crash =="
            grep -A 40 'FATAL EXCEPTION' smoke-results/logcat.txt | head -n 80
            FAIL=1
          fi

          [ "$FAIL" = 0 ] && echo "Smoke test OK: app mở được và không crash sau 500 thao tác."
          exit $FAIL
          EOF

      - name: Chạy máy ảo Android 14 và smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash smoke.sh

      - name: Upload kết quả smoke test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-results/
          if-no-files-found: ignore
          retention-days: 7